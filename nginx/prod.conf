# ============================================
# IMPORTANTE: Reemplaza TU_DOMINIO_AQUI con tu dominio real
# Ejemplo: server_name semillero-pixel.com www.semillero-pixel.com;
# ============================================

server {
    listen 80;
    server_name TU_DOMINIO_AQUI;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name TU_DOMINIO_AQUI;

    ssl_certificate /etc/nginx/ssl/live/TU_DOMINIO_AQUI/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/TU_DOMINIO_AQUI/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Increase body size for file uploads (10MB)
    client_max_body_size 10M;

    location /uploads/ {
        alias /app/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        proxy_pass http://pixel-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
