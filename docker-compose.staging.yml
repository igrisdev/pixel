services:
  pixel-db:
    image: postgres:16
    container_name: pixel_staging_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: staging_secure_password_2024
      POSTGRES_DB: pixel_staging
    ports:
      - "5433:5432"
    volumes:
      - pixel_staging_postgres_data:/var/lib/postgresql/data
    networks:
      - staging_network

  pixel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pixel_staging_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:staging_secure_password_2024@pixel-db:5432/pixel_staging
      NODE_ENV: staging
    ports:
      - "3001:3000"
    volumes:
      - pixel_staging_uploads:/app/uploads
    depends_on:
      - pixel-db
    networks:
      - staging_network

  pixel-nginx:
    image: nginx:alpine
    container_name: pixel_staging_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl/staging:/etc/nginx/ssl:ro
    depends_on:
      - pixel-app
    networks:
      - staging_network

volumes:
  pixel_staging_postgres_data:
  pixel_staging_uploads:

networks:
  staging_network:
    driver: bridge
